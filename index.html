<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Same-origin only. No third-party scripts, fonts, or network calls (children's game).
      style-src 'unsafe-inline': Phaser and our DOM overlays set inline styles on elements.
      img-src/media-src allow blob: and data: for generated textures and audio decoding.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob: https://voice.timeclash.rallytasks.com; font-src 'self'; connect-src 'self' https://voice.timeclash.rallytasks.com; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Time Clash</title>
    <!-- The icon from the design: a sword crossed with a laser sword on purple (Past and Future). -->
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
